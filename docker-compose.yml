services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # 只监听 127.0.0.1，Nginx 通过 host 网络访问
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - uploads_data:/app/public/uploads

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kaoyan_notes
      MYSQL_USER: note_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    cap_add:
      - SYS_NICE

volumes:
  mysql_data:
  uploads_data:
