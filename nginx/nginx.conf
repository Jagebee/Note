# 这个 Nginx 配置需要安装在服务器主机上（不是 Docker 内）
# 参考命令：
#   sudo ln -sf $PWD/nginx/nginx.conf /etc/nginx/sites-available/note
#   sudo ln -s /etc/nginx/sites-available/note /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d 你的域名.com
#   sudo systemctl reload nginx

upstream next_app {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name 你的域名.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 你的域名.com;

    ssl_certificate     /etc/letsencrypt/live/你的域名.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名.com/privkey.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 上传文件由 Nginx 直接响应（不走 Node）
    location /uploads/ {
        alias /var/lib/docker/volumes/note_uploads_data/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求转发给 Next.js
    location / {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Next.js 热更新，生产可忽略但无害）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
